[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valencia-flood-2024"
version = "1.0.0"
description = "Flood extent from a pre/post Landsat pair (read from Planetary Computer) and building exposure"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Xiaoqiao Liu"}]
dependencies = ["numpy>=1.24", "rasterio>=1.3", "geopandas>=1.0", "pyogrio>=0.9", "matplotlib>=3.7"]

[project.scripts]
flood-map = "flood_mapping.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
